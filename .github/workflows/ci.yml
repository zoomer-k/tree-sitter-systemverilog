name: CI


on:
  push:
    # branches: [master]
    # paths:
    #   - grammar.js
    #   - src/**
    #   - test/**
    #   - bindings/**
    #   - binding.gyp
  pull_request:
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:

  test:
    name: Test parser
    #runs-on: ${{matrix.os}}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
          abi_version: [14, 15]
          tree_sitter_version: [v0.25.3, v0.24.4]
          
    #     os: [ubuntu-latest, windows-latest, macos-14]
    env:
      TREE_SITTER_ABI_VERSION: ${{ matrix.abi_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v1
        with:
          tree-sitter-ref: ${{ matrix.tree_sitter_version }}
      # need json lock file
      # - name: Install dependencies
      #   run: npm ci --omit dev --omit peer --omit optional
      # - name: Verify parser
      #   run: git diff --exit-code -- src/parser.c
      
      - name: Generate parser 14
        if: ${{ matrix.abi_version != 15 }}
        run: |
          tree-sitter generate --abi=${{ matrix.abi_version }}
          [[ ! -d node_modules ]] || rm -rf node_modules
      # - name: Generate parser 15
      #   if: ${{ matrix.abi_version == 15 }}
      #   uses: tree-sitter/parser-test-action@v2
      #   with:
      #     generate: ${{ matrix.abi_version == 15 }}
      # - name: Test parser
      #   uses: tree-sitter/parser-test-action@v2
      #   with:
      #     test-parser: true
      - name: Test python binding
        uses: tree-sitter/parser-test-action@v2
        with:
          test-python: true
      - name: Test node binding
        uses: tree-sitter/parser-test-action@v2
        with:
          test-node: true
      - name: Test other binding
        uses: tree-sitter/parser-test-action@v2
        with:
          test-rust: true
          test-go: true
          test-swift: true
      # - name: Generate parser 14
      #   if: ${{ matrix.abi_version != 15 }}
      #   run: |
      #     tree-sitter generate --abi=${{ matrix.abi_version }}
      #     [[ ! -d node_modules ]] || rm -rf node_modules
      # - name: Generate parser 15
      #   uses: tree-sitter/parser-test-action@v2
      #   with:
      #     generate: ${{ matrix.abi_version == 15 }}
      # - name: Generate parser
      #   if: ${{ matrix.abi_version != 15 }}
      #   run: tree-sitter generate --abi=${{ matrix.abi_version }}
